name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Unit tests
        run: python -m unittest discover -s scripts -p "test*.py"
      - name: Replay fixtures
        run: python -m unittest discover -s Test/serial-job-session -p "test*.py"
      - name: Skill integrity
        run: python scripts/check_skill_integrity.py
